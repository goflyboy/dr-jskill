services:
  # MySQL Database
  mysql:
    image: mysql:8.3.0
    environment:
      MYSQL_DATABASE: mydb
      MYSQL_USER: ${SPRING_DATASOURCE_USERNAME:-user}
      MYSQL_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data-native:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    networks:
      - spring-network

  # Spring Boot Native Application (GraalVM)
  spring-app-native:
    build:
      context: .
      dockerfile: Dockerfile-native
      # Front-end build mirrors for corporate proxies. Defaults match the
      # Dockerfile; override them in .env — see workshop Appendix B.
      args:
        NODE_DOWNLOAD_ROOT: ${NODE_DOWNLOAD_ROOT:-https://nodejs.org/dist/}
        NPM_DOWNLOAD_ROOT: ${NPM_DOWNLOAD_ROOT:-https://registry.npmjs.org/npm/-/}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org}
    environment:
      SPRING_BOOT_PORT: ${SPRING_BOOT_PORT:-8080}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:8.3.0/mydb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-user}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
    ports:
      - "${SPRING_BOOT_PORT:-8080}:${SPRING_BOOT_PORT:-8080}"
    depends_on:
      mysql:
        condition: service_healthy
    # No app healthcheck: the native image runs on a distroless base with no shell,
    # curl or wget to run an in-container probe. Probe /actuator/health from outside
    # (or from your orchestrator's liveness/readiness checks) instead.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    networks:
      - spring-network
    restart: unless-stopped

volumes:
  mysql-data-native:
    driver: local

networks:
  spring-network:
    driver: bridge
