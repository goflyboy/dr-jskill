# Docker Compose file for Spring Boot development
# Place this file in your project root for automatic MySQL startup
# with spring-boot-docker-compose

services:
  mysql:
    image: mysql:8.3.0
    environment:
      MYSQL_DATABASE: mydb
      MYSQL_USER: ${SPRING_DATASOURCE_USERNAME:-user}
      MYSQL_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
