# Full stack (Spring Boot JVM + AOT image + MySQL) built from Dockerfile-aot.
#
#   docker compose -f docker-compose-aot.yml up --build
#
# The AOT image adds Spring AOT to the plain JVM image for faster startup, with no
# extra runtime infrastructure and no frozen profile (unlike GraalVM native). See
# references/DOCKER.md ("JVM + AOT").
services:
  # MySQL Database
  mysql:
    image: mysql:8.3.0
    environment:
      MYSQL_DATABASE: mydb
      MYSQL_USER: ${SPRING_DATASOURCE_USERNAME:-user}
      MYSQL_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data-aot:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    networks:
      - spring-network

  # Spring Boot Application (JVM + Spring AOT)
  spring-app-aot:
    build:
      context: .
      dockerfile: Dockerfile-aot
      # Front-end build mirrors for corporate proxies. Defaults match the
      # Dockerfile; override them in .env — see workshop Appendix B.
      args:
        NODE_DOWNLOAD_ROOT: ${NODE_DOWNLOAD_ROOT:-https://nodejs.org/dist/}
        NPM_DOWNLOAD_ROOT: ${NPM_DOWNLOAD_ROOT:-https://registry.npmjs.org/npm/-/}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org}
    environment:
      SPRING_BOOT_PORT: ${SPRING_BOOT_PORT:-8080}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:8.3.0/mydb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-user}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      # Spring AOT is already baked into JAVA_TOOL_OPTIONS in the image; set it
      # explicitly too so `docker inspect` shows the full effective config.
      SPRING_AOT_ENABLED: "true"
    ports:
      - "${SPRING_BOOT_PORT:-8080}:${SPRING_BOOT_PORT:-8080}"
    depends_on:
      mysql:
        condition: service_healthy
    # No app healthcheck: the image runs on a distroless base with no shell, curl or
    # wget to run an in-container probe. Probe /actuator/health from outside instead.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 768m
    networks:
      - spring-network
    restart: unless-stopped

volumes:
  mysql-data-aot:
    driver: local

networks:
  spring-network:
    driver: bridge
